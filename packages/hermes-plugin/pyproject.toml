[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-hermes-plugin"
version = "1.0.0"
description = "Hermes integration plugin for Nexus"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "hermes-pi-bridge-core @ file:///${PROJECT_ROOT}/packages/core",
]

[tool.setuptools.packages.find]
where = ["src"]
