name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python linting tools
        run: |
          python -m pip install ruff

      - name: Lint Python code
        run: |
          ruff check packages/core/src packages/hermes-plugin/src --ignore F401 --ignore F811 --ignore F841

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node.js dependencies
        working-directory: packages/pi-extension
        run: npm ci

      - name: Lint TypeScript code
        working-directory: packages/pi-extension
        run: npm run lint

  test-core:
    name: Test Core
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install core package
        run: |
          pip install -e packages/core
          pip install pytest pytest-asyncio pytest-cov websockets

      - name: Run core tests with coverage
        run: |
          pytest packages/core/tests --cov=hermes_pi_bridge_core --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  test-hermes:
    name: Test Hermes Plugin
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn httpx pydantic pytest pytest-asyncio pytest-cov

      - name: Run Hermes plugin tests with coverage
        env:
          PYTHONPATH: packages/core/src:packages/hermes-plugin/src
        run: |
          pytest packages/hermes-plugin/tests --cov=hermes_pi_bridge --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  test-pi:
    name: Test pi Extension
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: packages/pi-extension
        run: npm ci

      - name: Build
        working-directory: packages/pi-extension
        run: npm run build

      - name: Run tests
        working-directory: packages/pi-extension
        run: npx vitest run --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, test-core, test-hermes, test-pi]
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run integration tests
        run: |
          chmod +x integration/test.sh
          ./integration/test.sh

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Scan Python dependencies
        run: |
          pip install -e packages/core
          pip-audit

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit npm packages
        working-directory: packages/pi-extension
        run: npm audit --audit-level=high

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [integration]
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          registry-url: 'https://pypi.org/'

      - name: Install dependencies
        run: pip install build twine

      - name: Build package
        run: |
          cd packages/core
          python -m build

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          cd packages/core
          twine upload dist/*
